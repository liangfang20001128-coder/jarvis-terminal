services:
  - type: web
    name: jarvis-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JARVIS_PORT
        value: 8787
      - key: JARVIS_AGENT
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: JARVIS_OPENAI_MODEL
        value: deepseek-chat
      - key: JARVIS_OPENAI_BASE_URL
        value: https://api.deepseek.com/v1
      - key: JARVIS_LAUNCH
        value: "{}"
      - key: JARVIS_GAME_URL
        sync: false
